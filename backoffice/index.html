ting":{"@type":"Rating","ratingValue":5,"bestRating":5},"reviewBody":"Marcel Scheuermann ist ein äußerst kompetenter Versicherungsmakler, der mit Wissen, Innovation und Zuverlässigkeit überzeugt. Anliegen werden von ihm immer sehr zeitnah und abschließend bearbeitet. Er betreut uns mittlerweile so viele Jahre, wir möchten nicht mehr auf seine Kompetenz verzichten und genießen die Vorzüge der rundum Betreuung. Absolute Weiterempfehlung!"},{"@type":"Review","author":{"@type":"Person","name":"Michael Jung"},"reviewRating":{"@type":"Rating","ratingValue":5,"bestRating":5},"reviewBody":"Marcel ist ein Profi was das Thema Steuern zu Vermögen machen angeht. Durch seine Tipps konnte ich meine Steuerlast in Vermögen umwandeln. Er erklärt die Dinge so verständlich, dass auch ein absoluter Laie genau durchblickt warum was zu tun ist. Seine Beratung ist fair und transparent. Ich setze mich nach wie vor in regelmäßigen Abständen mit Marcel zusammen und kann ihn nur wärmstens empfehlen!"},{"@type":"Review","author":{"@type":"Person","name":"J. S."},"reviewRating":{"@type":"Rating","ratingValue":5,"bestRating":5},"reviewBody":"Marcel berät engagiert, verständlich, ehrlich und kompetent. Auch als Laie kann man der Beratung folgen. Für jede Nachfrage gibt es die passende Antwort."},{"@type":"Review","author":{"@type":"Person","name":"Nils Spitlbauer"},"reviewRating":{"@type":"Rating","ratingValue":5,"bestRating":5},"reviewBody":"Fantastische Beratung! Marcel Scheuermann betreut mich und meine Frau nun seit einigen Jahren. Egal um welches Thema es geht, er ist immer erreichbar. Die Beratungen sind immer ausführlich, ehrlich und der Lebenssituation angepasst. Als unser Sohn zur Welt kam, standen wir als Eltern vor einer großen Bürokratiehürde. Mit ihm haben wir es ohne Probleme geschafft auch alle Versicherungen, etc. für den kleinen Mann passend anzulegen. Selbst Fragen außerhalb seines Arbeitsgebietes sind für ihn kein Problem. Wir freuen uns so einen kompetenten und vertrauensvollen Berater an unserer Seite zu haben. 5 Sterne reichen hier bei weitem nicht aus!"},{"@type":"Review","author":{"@type":"Person","name":"Se Yu"},"reviewRating":{"@type":"Rating","ratingValue":5,"bestRating":5},"reviewBody":"Marcel arbeitet sehr strukturiert und übersichtlich für seine Kunden. Während unserer Beratung hat er Schritt für Schritt alles erklärt in einer Sprache, die jeder versteht. Ansonsten bekommt man von Finanzberater irgendwelche Fachbegriffe rumgeworfen. Er kennt sich mit den Gesetzen aus und ist immer up-to-date somit kann er auf jede Bedürfnisse eingehen und findet mehrere Optionen die er mit seinen Kunden bespricht und transparent macht. Der Kunde steht im Fokus und das spürt man! Er arbeitet mit Leidenschaft! Vielen Dank Marcel!"},{"@type":"Review","author":{"@type":"Person","name":"Dilara"},"reviewRating":{"@type":"Rating","ratingValue":5,"bestRating":5},"reviewBody":"Dieses Jahr habe ich auf der Didacta Marcel Scheuermann kennengelernt und bin dort direkt in seine Beratung gekommen. Er hat mich auf der Messe sehr sympathisch, offen und kompetent beraten, sodass ich direkt ein gutes Gefühl hatte. Auch im weiteren Verlauf der Beratung im Lehrer-Beratungszentrum hat sich dieser Eindruck absolut bestätigt. Die Gespräche waren durchweg freundlich, verständlich und nie aufdringlich. Man nimmt sich Zeit für Fragen und erklärt alles so, dass man es wirklich gut nachvollziehen kann. Genau deshalb habe ich mich entschieden, meine Versicherungen dort abzuschließen."},{"@type":"Review","author":{"@type":"Person","name":"Jennifer Barroso Sobrado"},"reviewRating":{"@type":"Rating","ratingValue":5,"bestRating":5},"reviewBody":"Mein Partner und ich fühlen uns sehr gut beraten. Der liebe Marcel ist sehr kompetent und freundlich! Alleine hätten wir uns nicht durch den ganzen Versicherungskram gequält. So war alles perfekt auf unsere Bedürfnisse und Anliegen abgestimmt und direkt eingegrenzt, ohne Druck und Stress. Vielen Dank dafür!"},{"@type":"Review","author":{"@type":"Person","name":"Lea Geffers"},"reviewRating":{"@type":"Rating","ratingValue":5,"bestRating":5},"reviewBody":"Ich wurde vor meinem Start ins Ref mit Empathie, Geduld und Zeit vom Mitarbeiter Marcel Schäfer beraten. Marcel schafft schon bei der ersten Kontaktaufnahme eine entspannte Atmosphäre, bleibt gleichzeitig aber immer professionell und kompetent. Ich habe mich in allen Belangen (bei mir besonders das Thema Versicherungen) exzellent beraten gefühlt und kann Marcel nur wärmstens empfehlen."},{"@type":"Review","author":{"@type":"Person","name":"Lea Gommel"},"reviewRating":{"@type":"Rating","ratingValue":5,"bestRating":5},"reviewBody":"Ich bin momentan sehr zufrieden mit der Beratung durch Marcel Scheuermann. Gerade im Hinblick auf meinen Start ins Referendariat habe ich mich bestens informiert und unterstützt gefühlt. Ich kann die Beratung wirklich jedem empfehlen, der vor dem Referendariat steht oder Unterstützung bei Versicherungsfragen braucht."},{"@type":"Review","author":{"@type":"Person","name":"Lynn"},"reviewRating":{"@type":"Rating","ratingValue":5,"bestRating":5},"reviewBody":"Das Beratungsgespräch bei Marcel Schäfer war wirklich super aufschlussreich. Er hat mir so viele offene Fragen beantwortet und ist auch wirklich transparent mit den ganzen Themen umgegangen und das Gespräch war super nett und kompetent. Auch, wenn ich schon fast am Ende des Refs bin, hat es mir nochmal sehr geholfen! Danke!"}]}</script><main class="min-h-screen bg-onyx px-6 py-16"><div class="mx-auto w-full max-w-4xl"><div class="mb-8 flex flex-col items-center text-center"><img alt="S² Finanz" loading="lazy" width="924" height="928" decoding="async" data-nimg="1" class="h-16 w-auto" style="color:transparent" src="/images/logo.png"/><p class="mt-2 text-sm text-nebel">Mitarbeiter-Backoffice</p></div><div class="mx-auto max-w-md rounded-sm border border-white/10 bg-graphit p-8 text-center text-sm text-nebel">Wird geladen …</div></div></main><!--$--><!--/$--><script src="/_n
